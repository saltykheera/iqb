# Azure Container Apps deployment pipeline
#
# Deploys mlabapi to Azure Container Apps using GitHub Actions.
#
# SETUP — add these secrets to your GitHub repo
# (Settings → Secrets and variables → Actions):
#
#   AZURE_CREDENTIALS      → output of: az ad sp create-for-rbac --sdk-auth
#   AZURE_SUBSCRIPTION_ID  → your Azure subscription ID
#   REGISTRY_USERNAME      → Azure Container Registry username
#   REGISTRY_PASSWORD      → Azure Container Registry password
#
# EDIT these variables to match your Azure setup:
#   env.REGISTRY            → your ACR name  (e.g. myregistry.azurecr.io)
#   env.RESOURCE_GROUP      → your resource group
#   env.CONTAINER_APP_NAME  → name for the Container App
#   env.CONTAINER_APP_ENV   → name for the Container App Environment

name: Deploy mlabapi to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "mlabapi/**"
      - "library/**"
  workflow_dispatch:           # allow manual trigger from GitHub UI

env:
  REGISTRY: yourregistry.azurecr.io        # ← change this
  IMAGE_NAME: iqb-mlabapi
  RESOURCE_GROUP: iqb-rg                   # ← change this
  CONTAINER_APP_NAME: iqb-mlabapi          # ← change this
  CONTAINER_APP_ENV: iqb-env               # ← change this
  LOCATION: eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to Azure ───────────────────────────────────
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 3. Log in to Azure Container Registry ────────────────
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── 4. Build and push Docker image ───────────────────────
      # Build context is repo root (needs library/ alongside mlabapi/)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mlabapi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── 5. Create resource group if needed ───────────────────
      - name: Create resource group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --output none

      # ── 6. Create Container Apps environment if needed ───────
      - name: Create Container Apps environment
        run: |
          az containerapp env create \
            --name ${{ env.CONTAINER_APP_ENV }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --output none 2>/dev/null || echo "Environment already exists"

      # ── 7. Deploy to Azure Container Apps ────────────────────
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp create \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APP_ENV }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --registry-server ${{ env.REGISTRY }} \
            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
            --target-port 8000 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --output none 2>/dev/null || \
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --output none

      # ── 8. Print the deployed URL ─────────────────────────────
      - name: Get deployed URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "✅ Deployed at: https://$URL"
          echo "📖 Swagger docs: https://$URL/docs"
