name: Build & Deploy mlabapi

on:
  push:
    branches: [main]
    paths:
      - "mlabapi/**"
      - "library/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to Docker Hub ───────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. Set up multi-platform builder ─────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build & push to Docker Hub ────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mlabapi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlabapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlabapi:${{ github.sha }}

      # ── 5. Log in to Azure ────────────────────────────────────
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 6. Redeploy Azure Container App ──────────────────────
      - name: Update Azure Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.AZURE_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ secrets.DOCKERHUB_USERNAME }}/mlabapi:${{ github.sha }}
